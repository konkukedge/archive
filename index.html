<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gaegu&family=Sunflower:wght@300&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Gaegu&family=Noto+Sans+KR:wght@100..900&family=Sunflower:wght@300&display=swap" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.3.1.min.js"></script>
    <script src="main.js"></script>
    <script src="https://www.gstatic.com/charts/loader.js"></script>

    <title>EDGE GAME ARCHIVE</title>
</head>
<header>
EDGE 게임 개발 경진대회 출품작
</header>
<body>
    <div id="loader">
      <div class="spinner"></div>
    </div>

    <aside class="list">
        <ul>
        </ul>
    </aside>
    <section class="game">
    </section>
    <div id="review-modal" class="modal">
      <div class="modal-content">
        <span class="close-button">&times;</span>
        <h2 id="modal-game-title">게임 제목</h2>
        <div id="review-list">
          </div>
        <hr>
        <h3>후기 남기기</h3>
        <form id="review-form">
          <input type="hidden" id="game-name-input" name="gameName">
          <input type="text" id="reviewer-name" name="reviewerName" placeholder="작성자 이름" required>
          <textarea id="review-text" name="reviewContent" placeholder="후기를 남겨주세요..." required></textarea>
          <button type="submit">후기 등록</button>
        </form>
      </div>
    </div>
</body>
</html>
